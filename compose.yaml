services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: crud_clientes
      DB_USER: root
      DB_PASS: root
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: crud_clientes
    ports:
      - "3306:3306"   # solo para desarrollo local (phpMyAdmin, SQLTools, etc.)
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro   # crea la tabla en el primer arranque
      - db_datos:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_datos:
